name: update-homebrew-formula

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]

permissions:
  contents: write

jobs:
  update-formula:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: master

      - name: Read published version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "VERSION=$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq .tag_name)" >> "$GITHUB_ENV"

      - name: Download release archives
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"
          for target in \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl
          do
            curl --fail --location --show-error \
              --output "yo-${VERSION}-${target}.tar.gz" \
              "${base}/yo-${VERSION}-${target}.tar.gz"
          done

      - name: Calculate checksums
        run: |
          echo "MAC_X64_SHA=$(sha256sum yo-${VERSION}-x86_64-apple-darwin.tar.gz | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          echo "MAC_ARM_SHA=$(sha256sum yo-${VERSION}-aarch64-apple-darwin.tar.gz | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          echo "LINUX_X64_SHA=$(sha256sum yo-${VERSION}-x86_64-unknown-linux-musl.tar.gz | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          echo "LINUX_ARM_SHA=$(sha256sum yo-${VERSION}-aarch64-unknown-linux-musl.tar.gz | cut -d ' ' -f1)" >> "$GITHUB_ENV"

      - name: Update and validate formula
        run: |
          cat > Formula/yo-bin.rb <<EOF
          class YoBin < Formula
            desc "Personal AI terminal assistant powered by Vercel AI Gateway"
            homepage "https://github.com/Montekkundan/yo"
            version "${VERSION}"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/Montekkundan/yo/releases/download/${VERSION}/yo-${VERSION}-aarch64-apple-darwin.tar.gz"
                sha256 "${MAC_ARM_SHA}"
              else
                url "https://github.com/Montekkundan/yo/releases/download/${VERSION}/yo-${VERSION}-x86_64-apple-darwin.tar.gz"
                sha256 "${MAC_X64_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/Montekkundan/yo/releases/download/${VERSION}/yo-${VERSION}-aarch64-unknown-linux-musl.tar.gz"
                sha256 "${LINUX_ARM_SHA}"
              else
                url "https://github.com/Montekkundan/yo/releases/download/${VERSION}/yo-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${LINUX_X64_SHA}"
              end
            end

            def install
              bin.install "yo"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/yo --version")
            end
          end
          EOF
          ruby -c Formula/yo-bin.rb

      - name: Commit updated formula
        run: |
          if git diff --quiet -- Formula/yo-bin.rb; then
            echo "Formula is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/yo-bin.rb
          git commit -m "chore(homebrew): update yo-bin.rb for ${VERSION}"
          git push origin master
