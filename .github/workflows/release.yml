name: release

on:
  push:
    tags:
    - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: prepare-release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Get the release version from the tag
        id: set_version
        run: |
          version="${GITHUB_REF#refs/tags/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Check that tag version and Cargo.toml version are the same
        shell: bash
        run: |
          if ! grep -q "version = \"$VERSION\"" Cargo.toml; then
            echo "version does not match Cargo.toml" >&2
            exit 1
          fi
  build-release:
    name: build (${{ matrix.target }})
    needs: ['prepare-release']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          target: x86_64-unknown-linux-musl
          install_musl: true
        - os: ubuntu-24.04-arm
          target: aarch64-unknown-linux-musl
          install_musl: true
        - os: macos-15-intel
          target: x86_64-apple-darwin
        - os: macos-latest
          target: aarch64-apple-darwin
        - os: windows-latest
          target: x86_64-pc-windows-msvc
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        target: ${{ matrix.target }}
    - name: Install musl-tools
      if: matrix.install_musl == true
      run: sudo apt-get update && sudo apt-get install -y musl-tools
    - name: Build release binary
      shell: bash
      run: |
        set -euo pipefail
        cargo build --release --locked --target ${{ matrix.target }}
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          bin="target/${{ matrix.target }}/release/yo.exe"
          archive="yo-${{ needs.prepare-release.outputs.version }}-${{ matrix.target }}.zip"
          7z a "$archive" "$bin"
        else
          bin="target/${{ matrix.target }}/release/yo"
          archive="yo-${{ needs.prepare-release.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar czf "$archive" -C "$(dirname $bin)" "$(basename $bin)"
        fi
        echo "ARCHIVE=$archive" >> $GITHUB_ENV
    - name: Stage release archive
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.target }}
        path: ${{ env.ARCHIVE }}
        if-no-files-found: error

  publish-release:
    name: publish-release
    needs: ['prepare-release', 'build-release']
    runs-on: ubuntu-latest
    steps:
    - name: Download verified release archives
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true
    - name: Create GitHub release with all archives
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        set -euo pipefail
        version="${{ needs.prepare-release.outputs.version }}"
        (cd artifacts && sha256sum yo-* > SHA256SUMS)
        gh release create "$version" artifacts/* --verify-tag --title "$version"
