name: release

on:
  push:
    tags:
    - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  prepare-release:
    name: prepare-release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Get the release version from the tag
        id: set_version
        run: |
          version="${GITHUB_REF#refs/tags/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Show the version
        run: |
          echo "version is: $VERSION"
      - name: Check that tag version and Cargo.toml version are the same
        shell: bash
        run: |
          if ! grep -q "version = \"$VERSION\"" Cargo.toml; then
            echo "version does not match Cargo.toml" >&2
            exit 1
          fi
  build-release:
    name: build-release
    needs: ['prepare-release']
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - build: linux
          os: ubuntu-latest
          rust: stable
          target: x86_64-unknown-linux-musl
        - build: macos
          os: macos-latest
          rust: stable
          target: x86_64-apple-darwin
        - build: windows
          os: windows-latest
          rust: stable
          target: x86_64-pc-windows-msvc
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        target: ${{ matrix.target }}
    - name: Install musl-tools (Linux musl only)
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: sudo apt-get update && sudo apt-get install -y musl-tools
    - name: Set OpenSSL to vendored (macOS only)
      if: matrix.os == 'macos-latest'
      run: |
        echo "OPENSSL_STATIC=1" >> $GITHUB_ENV
        echo "OPENSSL_VENDORED=1" >> $GITHUB_ENV
    - name: Set OpenSSL to vendored (Linux musl only)
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: |
        echo "OPENSSL_STATIC=1" >> $GITHUB_ENV
        echo "OPENSSL_VENDORED=1" >> $GITHUB_ENV
    - name: Build release binary
      shell: bash
      run: |
        set -e
        cargo build --release --target ${{ matrix.target }}
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          bin="target/${{ matrix.target }}/release/yo.exe"
          archive="yo-${{ needs.prepare-release.outputs.version }}-${{ matrix.target }}.zip"
          7z a "$archive" "$bin"
        else
          bin="target/${{ matrix.target }}/release/yo"
          archive="yo-${{ needs.prepare-release.outputs.version }}-${{ matrix.target }}.tar.gz"
          tar czf "$archive" -C "$(dirname $bin)" "$(basename $bin)"
        fi
        echo "ARCHIVE=$archive" >> $GITHUB_ENV
    - name: Stage release archive
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.target }}
        path: ${{ env.ARCHIVE }}
        if-no-files-found: error

  publish-release:
    name: publish-release
    needs: ['prepare-release', 'build-release']
    runs-on: ubuntu-latest
    steps:
    - name: Download verified release archives
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true
    - name: Create GitHub release with all archives
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        version="${{ needs.prepare-release.outputs.version }}"
        gh release create "$version" artifacts/* --verify-tag --title "$version"
