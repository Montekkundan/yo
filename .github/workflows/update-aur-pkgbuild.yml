name: update-aur-pkgbuild

on:
  workflow_run:
    workflows: ["release"]
    types: [completed]

permissions:
  contents: read

jobs:
  update-aur:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require distribution token
        env:
          DISTRIBUTION_TOKEN: ${{ secrets.DISTRIBUTION_TOKEN }}
        run: |
          if [ -z "$DISTRIBUTION_TOKEN" ]; then
            echo "::error::Add a DISTRIBUTION_TOKEN repository secret with write access to Montekkundan/yo-bin-aur."
            exit 1
          fi

      - name: Read published version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "VERSION=$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq .tag_name)" >> "$GITHUB_ENV"

      - name: Checkout AUR package repository
        uses: actions/checkout@v7
        with:
          repository: Montekkundan/yo-bin-aur
          token: ${{ secrets.DISTRIBUTION_TOKEN }}
          path: aur

      - name: Download archives and calculate checksums
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"
          curl --fail --location --show-error --output yo-linux-x64.tar.gz \
            "${base}/yo-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --show-error --output yo-linux-arm64.tar.gz \
            "${base}/yo-${VERSION}-aarch64-unknown-linux-musl.tar.gz"
          echo "X64_SHA=$(sha256sum yo-linux-x64.tar.gz | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          echo "ARM64_SHA=$(sha256sum yo-linux-arm64.tar.gz | cut -d ' ' -f1)" >> "$GITHUB_ENV"

      - name: Update and validate PKGBUILD
        run: |
          cat > aur/PKGBUILD <<EOF
          pkgname=yo-bin
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="Personal AI terminal assistant powered by Vercel AI Gateway"
          arch=('x86_64' 'aarch64')
          url="https://github.com/Montekkundan/yo"
          license=('MIT')
          source_x86_64=("https://github.com/Montekkundan/yo/releases/download/\${pkgver}/yo-\${pkgver}-x86_64-unknown-linux-musl.tar.gz")
          sha256sums_x86_64=('${X64_SHA}')
          source_aarch64=("https://github.com/Montekkundan/yo/releases/download/\${pkgver}/yo-\${pkgver}-aarch64-unknown-linux-musl.tar.gz")
          sha256sums_aarch64=('${ARM64_SHA}')

          package() {
            install -Dm755 "\${srcdir}/yo" "\${pkgdir}/usr/bin/yo"
          }
          EOF
          bash -n aur/PKGBUILD

      - name: Commit updated PKGBUILD
        working-directory: aur
        run: |
          if git diff --quiet -- PKGBUILD; then
            echo "PKGBUILD is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD
          git commit -m "Update yo to ${VERSION}"
          git push origin main
