[package]
name = "yo"
version = "2.0.0"
edition = "2021"
rust-version = "1.91.1"
authors = ["Montek Kundan <montekkundan@gmail.com>"]
license = "MIT"
description = "A personal AI assistant for your terminal, powered by model gateways."
readme = "README.md"
homepage = "https://github.com/montekkundan/yo"
repository = "https://github.com/montekkundan/yo"
keywords = ["ai", "cli", "terminal", "assistant", "gateway"]
categories = ["command-line-utilities"]
exclude = [
    ".github/*",
    ".omx/*",
    "Formula/*"
]

[lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
unused_lifetimes = "deny"

[lints.rustdoc]
all = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
clap = { version = "4.5.37", features = ["derive"] }
dirs = "6.0.0"
futures-util = "0.3.31"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["full"] }
toml = "1.1.3"
anyhow = "1.0.103"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
keyring = "4.1.5"
rpassword = "7.5.4"
termimad = "0.35.1"
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
crossterm = "0.29.0"
flate2 = "1.1.9"
semver = "1.0.28"
self-replace = "1.5.0"
sha2 = "0.11.0"
tar = "0.4.46"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tokio = { version = "1.44.2", features = ["full", "test-util"] }
uuid = { version = "1.23.5", features = ["v4"] }
