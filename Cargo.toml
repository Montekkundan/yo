[package]
name = "yo"
version = "1.3.5"
edition = "2021"
authors = ["Montek Kundan <montekkundan@gmail.com>"]
license = "MIT"
description = "A personal AI assistant for your terminal, powered by Vercel AI Gateway."
readme = "README.md"
homepage = "https://github.com/montekkundan/yo"
repository = "https://github.com/montekkundan/yo"
keywords = ["ai", "cli", "terminal", "assistant", "vercel"]
categories = ["command-line-utilities"]
exclude = [
    "target/*",
    "www/*",
    "tests/*",
    "*.lock",
    "*.yml",
    "*.rb",
    "*.glb",
    "*.svg",
    "*.html",
    "*.css",
    "*.json",
    "*.png",
    "*.jpg",
    "*.jpeg",
    "*.gif",
    "*.mp4",
    "*.mov",
    "*.avi",
    "*.zip",
    "*.tar",
    "*.gz",
    "*.7z",
    "*.exe",
    "*.dll",
    "*.so",
    "*.dylib",
    "*.bin",
    "*.crate",
    "Formula/*"
]

[dependencies]
clap = { version = "4.5.37", features = ["derive"] }
dirs = "6.0.0"
futures-util = "0.3.31"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.44.2", features = ["full"] }
toml = "0.8.20"
anyhow = "1.0.98"
rusqlite = { version = "0.31", features = ["bundled"] }
keyring = "4.1.5"
rpassword = "7.5.4"
termimad = "0.35.1"
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
crossterm = "0.29.0"

[dev-dependencies]
serial_test = "3.2.0"
tokio = { version = "1.44.2", features = ["full", "test-util"] }
uuid = { version = "1.23.5", features = ["v4"] }
