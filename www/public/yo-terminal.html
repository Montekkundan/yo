<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yo Terminal</title>
  <link rel="stylesheet" href="/yo.css" />
</head>
<body>
  <div class="terminal" id="terminal">
    <div class="output" id="output">
    </div>
    <div class="input-line" id="input-line">
      <span class="prompt">$</span>
      <input id="terminal-input" type="text" autocomplete="off" autofocus placeholder="Type a command..." />
    </div>
  </div>
  <script>
    const terminal = document.getElementById('terminal');
    const input = document.getElementById('terminal-input');
    const output = document.getElementById('output');
    const inputLine = document.getElementById('input-line');

    const commands = {
      'yo': 'your personal AI for the terminal, powered by Vercel AI Gateway\n\nUsage: yo [COMMAND]\n\nCommands:\n  ask            Ask Yo a question [aliases: a]\n  setup          Configure AI Gateway and choose a model\n  gateway        Manage the Gateway credential\n  models         List Gateway models\n  model          Choose a creator/model\n  run            Run a command and capture its real result\n  init           Print zsh, bash, or fish integration\n  new            Start a new chat for this terminal\n  chats          List local chats\n  memory         Manage local cross-session memory\n  personalize    Manage personalize.md\n  settings       Open the terminal settings interface\n  current        Show the active model, chat, and settings\n  help           Print this message\n\nOptions:\n  -h, --help     Print help\n  -V, --version  Print version',
      'yo --help': 'your personal AI for the terminal, powered by Vercel AI Gateway\n\nUsage: yo [COMMAND]\n\nCommands:\n  ask            Ask Yo a question [aliases: a]\n  setup          Configure AI Gateway and choose a model\n  gateway        Manage the Gateway credential\n  models         List Gateway models\n  model          Choose a creator/model\n  run            Run a command and capture its real result\n  init           Print zsh, bash, or fish integration\n  new            Start a new chat for this terminal\n  chats          List local chats\n  memory         Manage local cross-session memory\n  personalize    Manage personalize.md\n  settings       Open the terminal settings interface\n  current        Show the active model, chat, and settings\n  help           Print this message\n\nOptions:\n  -h, --help     Print help\n  -V, --version  Print version',
      'ls': 'yo  README.md',
      'pwd': '/home/montek',
      'whoami': 'montek',
      'help': 'Try: yo --help',
      'clear': '',
    };

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const value = input.value.trim();
        if (value) {
          if (value === 'clear') {
            output.innerHTML = '';
            input.value = '';
            inputLine.style.display = 'flex';
            terminal.scrollTop = terminal.scrollHeight;
            return;
          }
          if (value === 'cat README.md' || value === 'vi README.md' || value === 'nvim README.md') {
            window.open('https://github.com/Montekkundan/yo/blob/master/README.md', '_blank');
            output.innerHTML += `<br><span class='prompt'>(base) ➜</span> <span class='cwd'> montek</span> <span class='command'>${value}</span><br/>Opening README.md in browser...<br/>`;
            input.value = '';
            terminal.scrollTop = terminal.scrollHeight;
            return;
          }
          if (value === 'yo') {
            output.innerHTML += `<br><span class='prompt'>(base) ➜</span> <span class='cwd'> montek</span> <span class='command'>yo</span><br/>yo what?<br/>`;
            input.value = '';
            terminal.scrollTop = terminal.scrollHeight;
            return;
          }
          if (value === 'yo --help') {
            output.innerHTML += `<br><span class='prompt'>(base) ➜</span> <span class='cwd'> montek</span> <span class='command'>yo --help</span><br/>` + commands['yo --help'].replace(/\n/g, '<br/>') + '<br/>';
            input.value = '';
            terminal.scrollTop = terminal.scrollHeight;
            return;
          }
          if (value.startsWith('yo ')) {
            output.innerHTML += `<br><span class='prompt'>(base) ➜</span> <span class='cwd'> montek</span> <span class='command'>${value}</span><br/>yo add it to your machine first!<br/>`;
            input.value = '';
            terminal.scrollTop = terminal.scrollHeight;
            return;
          }
          output.innerHTML += `<br><span class='prompt'>(base) ➜</span> <span class='cwd'> montek</span> <span class='command'>${value}</span><br/>`;
          if (commands[value] !== undefined) {
            output.innerHTML += commands[value].replace(/\n/g, '<br/>') + '<br/>';
          } else {
            output.innerHTML += `command not found: ${value}<br/>`;
          }
          input.value = '';
          terminal.scrollTop = terminal.scrollHeight;
        }
      }
      if (e.key === 'Tab') {
        e.preventDefault();
        const val = input.value.trim();
        // Autocomplete for 'cat README.md', 'vi README.md', 'nvim README.md'
        if (
          val === 'cat R' || val === 'cat RE' || val === 'cat READ' || val === 'cat README' || val === 'cat README.' ||
          val === 'vi R' || val === 'vi RE' || val === 'vi READ' || val === 'vi README' || val === 'vi README.' ||
          val === 'nvim R' || val === 'nvim RE' || val === 'nvim READ' || val === 'nvim README' || val === 'nvim README.'
        ) {
          const cmd = val.split(' ')[0];
          input.value = cmd + ' README.md';
        } else if (val === 'cat' || val === 'cat ' || val === 'vi' || val === 'vi ' || val === 'nvim' || val === 'nvim ') {
          const cmd = val.trim();
          input.value = cmd + (cmd ? ' README.md' : 'README.md');
        } else if (val === 'README' || val === 'README.' || val === 'RE' || val === 'READ') {
          input.value = 'README.md';
        } else if (val === 'ls') {
          input.value = 'ls';
        } else if (val === 'yo') {
          input.value = 'yo';
        } else if (val === 'cd RE' || val === 'cd READ' || val === 'cd README' || val === 'cd README.') {
          input.value = 'cd README.md';
        }
      }
    });
  </script>
</body>
</html>
